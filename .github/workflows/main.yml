name: "Sanity Check"

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.ini"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.ini"
  workflow_dispatch:

env:
  hen-bin: ps4debug-ng.bin

jobs:
  build:
    permissions:
      contents: write
    # Force the specific runner version your build.sh script demands
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Build Payload natively on host
        env:
          # Mimics the environment mapping done by the SDK container
          PS4SDK: ${{ github.workspace }}/ps4-payload-sdk
        run: bash build.sh

      - name: Upload payload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.hen-bin }}
          path: ${{ env.hen-bin }}

      - name: Determine release type and tag
        if: github.event_name != 'pull_request'
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            latest_tag=$(gh release view --json tagName --jq .tagName || echo "")
            if [ -z "$latest_tag" ]; then
              tag_name="pre-release-${GITHUB_REF##*/}-${GITHUB_RUN_NUMBER}"
            else
              tag_name="${latest_tag}-pre-release-${GITHUB_RUN_NUMBER}"
            fi
            echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "tag_name=$tag_name"
          fi

      - name: Create or Update GitHub release
        if: github.event_name != 'pull_request' && steps.vars.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.vars.outputs.tag_name }}" "${{ env.hen-bin }}" --clobber || \
          gh release create "${{ steps.vars.outputs.tag_name }}" "${{ env.hen-bin }}" --target ${{ github.sha }} -t "${{ steps.vars.outputs.tag_name }}" --generate-notes

      - name: Create GitHub pre-release
        if: github.event_name != 'pull_request' && steps.vars.outputs.is_release != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.vars.outputs.tag_name }}" "${{ env.hen-bin }}" --target ${{ github.sha }} -t "${{ steps.vars.outputs.tag_name }}" -p --generate-notes
